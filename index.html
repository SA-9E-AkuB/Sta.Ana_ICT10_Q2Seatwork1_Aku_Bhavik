<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Directory - Candidate Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            background: url('https://image.slidesdocs.com/responsive-images/background/purple-light-effect-abstract-education-music-note-powerpoint-background_e515e45785__783_440.jpg') center/cover no-repeat fixed;
            color: #e2e2e8;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .hero-title { font-size: 2.4rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .hero-title span { color: #bd91ff; }
        .subtitle { color: #d1c4e9; font-size: 0.95rem; margin-bottom: 25px; }
        .custom-card {
            background: rgba(27, 27, 35, 0.88);
            backdrop-filter: blur(6px);
            border: 1px solid #30303c;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-label { font-size: 0.85rem; font-weight: 600; color: #d8baff; margin-bottom: 6px; }
        .form-control {
            background: #111117; color: #fff; border: 1px solid #3b3b49;
            border-radius: 10px; padding: 12px 14px; font-size: 0.95rem;
        }
        .form-control:focus { background: #111117; color: #fff; border-color: #bd91ff; box-shadow: 0 0 0 3px rgba(189,145,255,0.15); }
        .form-control::placeholder { color: #888899; }
        .btn-purple {
            background: #bd91ff; color: #15101e; font-weight: 700;
            border-radius: 10px; padding: 12px; border: none; width: 100%; transition: 0.2s;
        }
        .btn-purple:hover { background: #d1b5ff; }
        .result-box {
            background: rgba(41, 32, 53, 0.9); border: 1px solid #3d3052;
            border-radius: 12px; padding: 20px; min-height: 85px;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        #results { color: #d8baff; font-size: 1rem; font-weight: 600; line-height: 1.5; word-break: break-word; }
    </style>
</head>
<body>
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="custom-card">
                    <div class="text-center">
                        <h1 class="hero-title">Artist <span>Directory.</span></h1>
                        <p class="subtitle">Candidate Verification System</p>
                    </div>
                    <div class="mb-3">
                        <label for="first_name" class="form-label">First Name</label>
                        <input id="first_name" type="text" class="form-control" placeholder="Enter first name">
                    </div>
                    <div class="mb-4">
                        <label for="last_name" class="form-label">Last Name</label>
                        <input id="last_name" type="text" class="form-control" placeholder="Enter last name">
                    </div>
                    <button class="btn btn-purple mb-4" py-click="verify_candidate">Verify Candidate</button>
                    <div class="result-box">
                        <div id="results">Enter candidate name above to verify status...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    
    <script type="py" src="main.py"></script>
</body>
</html>
